<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2129"/>
      <stop offset="100%" stop-color="#0F1419"/>
    </linearGradient>
    <linearGradient id="mvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#3E6BC4"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#2A333D" stroke-width="4"/>
  <!-- Logo Mark -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#mvGrad)"/>
  <!-- MV Monogram -->
  <text x="256" y="295" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="140" font-weight="800" fill="#0F1419" text-anchor="middle" letter-spacing="-4">MV</text>
</svg>
